services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: email_checker
      POSTGRES_USER: email_checker
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Set LOCAL_DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_checker"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports: ["8000:8000"]
    environment: &app_environment
      DATABASE_URL: postgresql://email_checker:${LOCAL_DATABASE_PASSWORD}@postgres:5432/email_checker
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Generate ENCRYPTION_KEY first}
      PUBLIC_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:8000
      SECURE_COOKIES: "false"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *app_environment
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
